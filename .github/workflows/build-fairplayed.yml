name: Build unsigned FairPlayed helper

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-fairplayed.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Fetch reviewed public helper source only
        uses: actions/checkout@v4
        with:
          repository: morzelowski/FairPlayed
          ref: bad7df138839b5e0ac8b9f20cc4689140b8436fb
          persist-credentials: false

      - name: Build unsigned ARM64 device helper
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project FairPlayed/FairPlayed.xcodeproj \
            -target FairPlayed \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/helper-build" \
            build
          xcrun lipo -info "$RUNNER_TEMP/helper-build/FairPlayed.app/FairPlayed"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/helper-build/FairPlayed.app" "$RUNNER_TEMP/package/Payload/FairPlayed.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/FairPlayed-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/FairPlayed-unsigned.ipa" > "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Export unsigned helper (no target IPA, licenses or credentials)
        uses: actions/upload-artifact@v4
        with:
          name: FairPlayed-unsigned
          path: |
            FairPlayed-unsigned.ipa
            SHA256SUMS.txt
          retention-days: 7

